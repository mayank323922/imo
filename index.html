<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Connection Error</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 229, 255, 0.45),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(139, 92, 246, 0.50),
          transparent 38%
        ),
        radial-gradient(
          circle at 80% 85%,
          rgba(236, 72, 153, 0.42),
          transparent 38%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(34, 197, 94, 0.32),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #06152d,
          #15103b,
          #25123d
        );
    }

    body::before {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;

      border-radius: 50%;

      background: rgba(0, 217, 255, 0.16);

      filter: blur(70px);

      top: -120px;
      left: -100px;

      animation: floatOne 8s ease-in-out infinite;
    }

    body::after {
      content: "";
      position: fixed;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      background: rgba(236, 72, 153, 0.18);

      filter: blur(80px);

      bottom: -150px;
      right: -120px;

      animation: floatTwo 9s ease-in-out infinite;
    }

    .error-card {
      position: relative;
      z-index: 2;

      width: min(430px, calc(100% - 40px));

      padding: 55px 25px;

      text-align: center;

      border-radius: 32px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.05)
        );

      border: 1px solid
        rgba(255, 255, 255, 0.25);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);

      animation: appear 0.7s ease;
    }

    .error-icon {
      width: 110px;
      height: 110px;

      margin: 0 auto 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-size: 55px;
      font-weight: bold;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #ff3b5c,
          #ff2d7a,
          #9f3cff
        );

      box-shadow:
        0 15px 40px rgba(255, 45, 122, 0.45);

      animation: pulse 2s infinite;
    }

    h1 {
      color: #ffffff;

      font-size: clamp(28px, 7vw, 38px);

      line-height: 1.15;

      letter-spacing: 1px;

      font-weight: 800;

      text-transform: uppercase;

      text-shadow:
        0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .line {
      width: 75px;
      height: 5px;

      margin: 28px auto;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #00d9ff,
          #8b5cf6,
          #ff3b8d
        );

      box-shadow:
        0 0 20px rgba(0, 217, 255, 0.5);
    }

    h2 {
      color: #ffd9e4;

      font-size: clamp(20px, 5vw, 27px);

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes floatOne {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(60px, 70px);
      }
    }

    @keyframes floatTwo {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-70px, -60px);
      }
    }
  </style>
</head>

<body>

  <div class="error-card">

    <div class="error-icon">!</div>

    <h1>CAN'T ACCESS WEBSITE</h1>

    <div class="line"></div>

    <h2>CONNECTION ERROR</h2>

  </div>

</body>
</html>
