<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMO ID FAST UNBAN SERVICE</title>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,Helvetica,sans-serif;
      overflow:hidden;
      background:
        radial-gradient(circle at 10% 15%, rgba(0,229,255,.38), transparent 30%),
        radial-gradient(circle at 90% 12%, rgba(140,82,255,.38), transparent 32%),
        radial-gradient(circle at 85% 88%, rgba(255,68,157,.32), transparent 34%),
        radial-gradient(circle at 15% 85%, rgba(0,255,174,.25), transparent 30%),
        linear-gradient(135deg,#07182f,#14275a 50%,#29124b);
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      width:280px;
      height:280px;
      border-radius:50%;
      filter:blur(35px);
      opacity:.35;
      pointer-events:none;
      animation:float 8s ease-in-out infinite;
    }

    body::before{
      background:#00c8ff;
      top:-130px;
      left:-120px;
    }

    body::after{
      background:#a855f7;
      right:-130px;
      bottom:-130px;
      animation-delay:-4s;
    }

    @keyframes float{
      0%,100%{transform:translate(0,0) scale(1);}
      50%{transform:translate(30px,20px) scale(1.12);}
    }

    .service-card{
      width:min(430px,100%);
      position:relative;
      z-index:2;
      padding:34px 26px 28px;
      border-radius:28px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.24);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:
        0 28px 70px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.18);
      animation:cardIn .55s ease;
    }

    @keyframes cardIn{
      from{opacity:0;transform:translateY(25px) scale(.96);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }

    .heading{
      margin:0 0 28px;
      text-align:center;
      color:#fff;
      font-size:26px;
      line-height:1.25;
      font-weight:800;
      letter-spacing:.2px;
      text-shadow:0 3px 20px rgba(0,0,0,.25);
    }

    .input-wrap{
      position:relative;
      margin-bottom:16px;
    }

    .id-input{
      width:100%;
      height:58px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.20);
      outline:none;
      padding:0 18px;
      font-size:16px;
      color:#fff;
      background:rgba(8,18,45,.34);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }

    .id-input::placeholder{
      color:rgba(255,255,255,.58);
    }

    .id-input:focus{
      border-color:rgba(100,210,255,.75);
      box-shadow:0 0 0 4px rgba(0,183,255,.12);
    }

    .submit-btn,
    .close-btn{
      width:100%;
      border:0;
      border-radius:16px;
      height:56px;
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .submit-btn{
      background:linear-gradient(135deg,#00a8ff,#4f46e5 52%,#a855f7);
      box-shadow:0 15px 32px rgba(59,76,255,.30);
    }

    .processing{
      display:none;
      text-align:center;
      color:#fff;
      padding:8px 0 0;
    }

    .processing.show{
      display:block;
      animation:fadeIn .35s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px);}
      to{opacity:1;transform:translateY(0);}
    }

    .spinner{
      width:64px;
      height:64px;
      margin:6px auto 20px;
      border-radius:50%;
      border:6px solid rgba(255,255,255,.16);
      border-top-color:#fff;
      border-right-color:#38bdf8;
      animation:spin .85s linear infinite;
      box-shadow:0 0 28px rgba(56,189,248,.30);
    }

    @keyframes spin{
      to{transform:rotate(360deg);}
    }

    .processing-text{
      font-size:19px;
      font-weight:700;
      margin-bottom:24px;
    }

    .close-btn{
      display:none;
      background:linear-gradient(135deg,#ff3b7a,#f43f5e);
      box-shadow:0 14px 30px rgba(244,63,94,.26);
    }

    .close-btn.show{
      display:block;
      animation:fadeIn .35s ease;
    }

    .form-area.hide{
      display:none;
    }

    .site-closed{
      display:none;
      position:fixed;
      inset:0;
      z-index:10;
      background:#07111f;
    }

    .site-closed.show{
      display:block;
    }
  </style>
</head>

<body>

  <main class="service-card">
    <h1 class="heading">IMO ID FAST UNBAN SERVICE</h1>

    <div class="form-area" id="formArea">
      <div class="input-wrap">
        <input type="text" class="id-input" id="imoId" placeholder="Enter ID" autocomplete="off">
      </div>
      <button class="submit-btn" id="submitBtn" type="button">Submit</button>
    </div>

    <div class="processing" id="processing">
      <div class="spinner" id="spinner"></div>
      <div class="processing-text" id="processingText">Your Request Processing...</div>
      <button class="close-btn" id="closeBtn" type="button">Close</button>
    </div>
  </main>

  <div class="site-closed" id="siteClosed"></div>

  <script>
    const submitBtn = document.getElementById("submitBtn");
    const closeBtn = document.getElementById("closeBtn");
    const formArea = document.getElementById("formArea");
    const processing = document.getElementById("processing");
    const spinner = document.getElementById("spinner");
    const processingText = document.getElementById("processingText");
    const siteClosed = document.getElementById("siteClosed");
    const imoId = document.getElementById("imoId");

    submitBtn.addEventListener("click", () => {
      if (imoId.value.trim() === "") {
        imoId.focus();
        return;
      }

      formArea.classList.add("hide");
      processing.classList.add("show");

      // After 2 seconds, stop the loader and show successful request status.
      setTimeout(() => {
        spinner.style.display = "none";
        processingText.textContent = "Request Successfully Sent";
        closeBtn.classList.add("show");
      }, 2000);
    });

    closeBtn.addEventListener("click", () => {
      siteClosed.classList.add("show");
    });
  </script>

</body>
</html>
