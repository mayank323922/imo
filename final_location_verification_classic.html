<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
  <title>Location Verification</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f4f4f4;
    }

    .card {
      width: min(430px, 100%);
      padding: 34px 26px 28px;
      text-align: center;
      border: 1px solid #d6d6d6;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      color: #222;
      animation: enter .55s ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.4px;
    }

    .desc {
      margin: 12px auto 24px;
      max-width: 340px;
      color: #666;
      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      min-height: 52px;
      margin-bottom: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #f6f6f6;
      color: #444;
      border: 1px solid #e2e2e2;
      font-size: 14px;
      line-height: 1.45;
    }

    .status.success {
      background: rgba(34,197,94,.13);
      color: #86efac;
      border: 1px solid rgba(34,197,94,.24);
    }

    .status.error {
      background: rgba(239,68,68,.12);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,.22);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 14px 20px;
      color: #fff;
      background: #333;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      transition: transform .18s ease, opacity .18s ease;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .privacy {
      margin-top: 18px;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }

    .spinner {
      width: 18px;
      height: 18px;
      display: inline-block;
      margin-right: 9px;
      vertical-align: -4px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: currentColor;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 id="title">Location Verification</h1>

    <p class="desc" id="desc">
      Tap the button below to share your current location for verification.
    </p>

    <div class="status" id="status">Ready for verification</div>

    <button id="locationBtn" type="button">Click to Location</button>

    <div class="privacy">
      Your browser will ask for location permission before your location is shared.
    </div>
  </main>

<script>
  const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwsXKLXTkWGtanhijRCtT8FV-E1_YmFZtNddqLMSWaOIX8ur9frOT31HjbVCWwel9rsZw/exec";

  const btn = document.getElementById("locationBtn");
  const statusBox = document.getElementById("status");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const icon = document.getElementById("icon");

  function setStatus(message, type = "") {
    statusBox.className = "status" + (type ? " " + type : "");
    statusBox.innerHTML = message;
  }

  function setLoading(text) {
    btn.disabled = true;
    btn.innerText = "Please Wait...";
    setStatus('<span class="spinner"></span>' + text);
  }

  function showTryAgain(message) {
    btn.disabled = false;
    btn.innerText = "Try Again";
    setStatus(message, "error");
  }

  function showDone() {
    btn.disabled = true;
    btn.innerText = "Verification Done ✓";
    title.innerText = "Verification Done";
    desc.innerText = "Your location has been successfully saved.";
    if (icon) icon.innerText = "✓";
    setStatus("Location saved successfully", "success");
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject({ code: 0, message: "Location is not supported by this browser." });
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    });
  }

  async function saveToSheet(payload) {
    /*
      Google Apps Script commonly redirects POST requests from script.google.com
      to script.googleusercontent.com. "redirect: follow" is therefore required.
      This function reads the JSON response and only reports success when
      the deployed script returns { success: true }.
    */
    const response = await fetch(SHEET_WEBAPP_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error("Server request failed.");
    }

    const result = await response.json();

    if (!result || result.success !== true) {
      throw new Error(
        (result && result.message)
          ? result.message
          : "Location could not be saved."
      );
    }

    return result;
  }

  btn.addEventListener("click", async () => {
    setLoading("Getting your location...");

    try {
      const position = await getLocation();

      setLoading("Saving location to verification system...");

      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        maps:
          "https://www.google.com/maps?q=" +
          position.coords.latitude +
          "," +
          position.coords.longitude,
        timezone:
          Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      };

      await saveToSheet(payload);

      showDone();

    } catch (error) {
      let message = "Verification failed. Please try again.";

      if (error && error.code === 1) {
        message = "Location permission was denied. Please allow Location and try again.";
      } else if (error && error.code === 2) {
        message = "Location is unavailable. Turn on GPS/Location and try again.";
      } else if (error && error.code === 3) {
        message = "Location request timed out. Please try again.";
      } else if (error && error.message) {
        message = error.message;
      }

      showTryAgain(message);
    }
  });
</script>
</body>
</html>
